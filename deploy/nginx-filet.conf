# deploy/nginx-filet.conf — Filet M2 反向代理（同源：dashboard + Public API 共用一個 origin）
#
# 佔位符（部署日填入，見 deploy/RUNBOOK.md）：
#   FILET_DOMAIN_PLACEHOLDER  — 對外網域（例如 filet.example.com）。certbot --nginx 會自動
#                                改寫本檔的 ssl_certificate 指令；下方路徑供 certbot 執行前的
#                                語法自查與非 certbot-nginx-plugin 流程備用。
#
# 路由：
#   /api/  -> Public API（FastAPI，127.0.0.1:8700，僅本機監聽——見 filet-api.service
#             的 FILET_API_PORT。若部署時覆寫該環境變數，這裡的 upstream port 要同步改，
#             否則會出現「服務正常但外部連不到」的假故障）。
#   /      -> Dashboard（Next.js，127.0.0.1:3000，僅本機監聽——見 filet-dashboard.service）。
#
# 同源（same-origin）是刻意設計：Public API 的 session cookie 靠同源生效，不依賴 CORS。
# 不要把 API 放到獨立子網域，否則 SameSite=Lax cookie 會失效，需重新設計 auth。

# ---- HTTP：ACME challenge 放行 + 其餘一律轉 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name FILET_DOMAIN_PLACEHOLDER;

    # certbot webroot 模式用；若改用 certbot --nginx 外掛，此 location 由外掛自動注入，
    # 保留此區塊也無害。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS：同源反代 dashboard + API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name FILET_DOMAIN_PLACEHOLDER;

    # certbot 管理的憑證路徑（certbot --nginx 會自動填好並維護續期；手動 webroot 流程
    # 也是這個路徑慣例：/etc/letsencrypt/live/<domain>/）。
    ssl_certificate     /etc/letsencrypt/live/FILET_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FILET_DOMAIN_PLACEHOLDER/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 非託管系統：不接受大 body（onboarding 端點都是小 JSON payload）。
    client_max_body_size 256k;

    # 安全 headers（同源架構下不需要任何 CORS 相關 header——刻意不加）。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # ---- Public API（FastAPI）----
    # 注意：proxy_pass 這裡刻意不帶尾端路徑（沒有 "http://.../"），nginx 會把完整原始
    # URI（含 /api/ 前綴）原封轉發——FastAPI 路由本身就是掛在 /api/ 底下（見
    # src/spark/publicapi/app.py），不需要也不能在這裡剝掉前綴。
    location /api/ {
        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        # cookie 認證走同源，不轉發/改寫 Set-Cookie 屬性；FastAPI 端已設 Secure/HttpOnly/SameSite。
    }

    # ---- Dashboard（Next.js）----
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
