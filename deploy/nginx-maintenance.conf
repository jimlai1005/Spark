# deploy/nginx-maintenance.conf — Filet 維護模式開關（2026-10-04，RUNBOOK §5.8k）
#
# 安裝：複製到 /etc/nginx/snippets/filet-maintenance.conf，並在
# /etc/nginx/sites-enabled/filet 的 HTTPS server { ... }（trade.filet.app）區塊
# 內加一行 `include /etc/nginx/snippets/filet-maintenance.conf;`，`nginx -t` 後 `reload`
# （reload 是優雅重載，不中斷連線、不動任何 filet unit）。
#
# 開：  sudo touch /var/www/maintenance/ON      → 所有路徑（含 /api/）回 503 ＋維護頁
# 關：  sudo rm -f /var/www/maintenance/ON      → 立即恢復，不必 reload
#
# 維護頁本體在 /var/www/maintenance/index.html（來源 deploy/maintenance/index.html，
# 開窗時把 __ETA_TPE__／__ETA_UTC__／__START_UTC__ 填進去）。503 ＋ Retry-After 讓
# 搜尋引擎與客戶端知道這是暫時的；no-store 避免維護頁被快取到恢復之後。
#
# 本機／內部檢查不受影響：filet-api 仍可用 http://127.0.0.1:8700 直連。

set $filet_maint 0;
if (-f /var/www/maintenance/ON) {
    set $filet_maint 1;
}
if ($filet_maint = 1) {
    return 503;
}
error_page 503 @filet_maintenance;
location @filet_maintenance {
    root /var/www/maintenance;
    add_header Retry-After 900 always;
    add_header Cache-Control "no-store" always;
    rewrite ^(.*)$ /index.html break;
}
